# order-center Alembic configuration
#
# NOTE: keep this file ASCII-only.
# configparser reads it with the system locale (GBK on this machine),
# so non-ASCII characters here cause UnicodeDecodeError.
#
# sqlalchemy.url is intentionally empty: alembic/env.py builds the real URL
# from environment variables (MYSQL_HOST / MYSQL_PORT / MYSQL_USER /
# MYSQL_PASSWORD / MYSQL_DATABASE).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
