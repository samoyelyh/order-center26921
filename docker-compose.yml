# ============================================================================
# order-center 独立编排
#
#   mysql        : MySQL（order-center 订单库）
#   backend      : FastAPI（订单中心，启动自动 alembic upgrade head）
#   material-platform : 可选（profile=full）——素材库后端，order-center 通过其 REST 契约匹配
#
# 用法：
#   docker compose up -d mysql backend                       # 只用订单库（匹配走 Fake）
#   docker compose --profile full up -d --build              # 连素材平台一起起
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: oc-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: order_center
    ports:
      - "3306:3306"
    volumes:
      - oc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oc-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DATABASE: order_center
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: ./storage
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 素材平台契约：连 material-platform 后端；留空回退 Fake
      MATERIAL_PLATFORM_BASE_URL: http://material-platform:8000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CORS_ALLOW_ORIGIN_REGEX: ^http://(localhost|127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})(:\d{1,5})?$
    ports:
      - "8010:8010"
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8010"

  # 可选：素材平台（与 order-center 通过 REST 契约交互）
  material-platform:
    build:
      context: ../material-platform/backend
      dockerfile: Dockerfile
    container_name: mp-backend
    profiles: ["full"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DATABASE: material_center
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: ./storage
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  oc-mysql-data:
